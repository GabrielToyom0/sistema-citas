name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - name: docker-compose.yml válido
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose --env-file .env.example config --quiet
