server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Mismo origen: el navegador no necesita CORS y la API no se expone directamente.
  location /api/ {
    proxy_pass http://api-citas:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $request_id;
    client_max_body_size 16k;
  }

  location / {
    try_files $uri /index.html;
  }
}
